<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#20263d" />
  <title>Sarah — Fifty & Fabulous Photo Booth</title>
  <style>
    :root{--navy:#20263d;--ink:#221923;--gold:#e9c16e;--gold-deep:#bd8130;--shadow:#130d20aa}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{width:100%;min-height:100%;margin:0}body{background:var(--navy);color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}button{font:inherit;min-height:64px;padding:14px 22px;border:0;border-radius:18px;font-size:18px;font-weight:900;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #0002}button:disabled{opacity:.45;cursor:not-allowed}.screen{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));overflow:hidden}.invitation-bg{background:radial-gradient(circle at 50% 44%,#efe7e6 0 13%,#f5d8d5 35%,#303750 83%,#182037 100%)}.invitation-bg:before,.invitation-bg:after{content:"✿  ❀  ✿  ✧  ✿  ❀  ✿";position:absolute;color:#f4d8d5;font-size:clamp(34px,5vw,68px);letter-spacing:12px;white-space:nowrap;opacity:.94;text-shadow:0 2px 5px #4d263a77}.invitation-bg:before{top:8px;left:50%;transform:translateX(-50%)}.invitation-bg:after{bottom:5px;left:50%;transform:translateX(-50%)}.hero{text-align:center;max-width:920px;position:relative;z-index:1}.eyebrow{color:var(--gold-deep);letter-spacing:.16em;text-transform:uppercase;font-weight:900;font-size:14px;text-shadow:0 1px #fff}.title{margin:11px 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,8vw,94px);line-height:.92;color:var(--navy);text-shadow:0 2px #fff8}.title .gold{display:block;color:var(--gold);font-size:1.22em;text-shadow:0 2px 1px #805317,0 0 15px #fff}.script{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:clamp(32px,5.3vw,64px);color:#201626;margin:8px 0 16px}.tagline{color:#433242;font-size:clamp(18px,2.4vw,25px);line-height:1.42;margin:0 auto;max-width:720px}.primary{background:linear-gradient(135deg,#ffe8a3,#d99a38);color:#3e2418;box-shadow:0 7px 0 #9b6021,0 14px 32px #6b263877;min-width:270px}.secondary{background:#fff9;color:#482a3a;border:2px solid #b9788d66}.danger{background:#c65467;color:#fff}.controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}.logo{position:absolute;z-index:8;top:max(17px,env(safe-area-inset-top));left:max(19px,env(safe-area-inset-left));font-family:Georgia,serif;color:#f6db9c;font-size:18px;text-shadow:0 2px 3px #111;user-select:none}.camera-screen{padding:0;background:#000}.camera-screen #video{width:100%;height:100dvh;object-fit:cover;transform:scaleX(-1);background:#111}.camera-top,.camera-bottom{position:absolute;z-index:4;left:0;right:0;display:flex;justify-content:center;pointer-events:none}.camera-top{top:max(18px,env(safe-area-inset-top))}.camera-bottom{bottom:max(26px,env(safe-area-inset-bottom))}.status{color:#fff;background:#1b1524c9;border:1px solid #ffffff55;backdrop-filter:blur(9px);border-radius:999px;padding:10px 19px;font-size:18px;font-weight:900;text-align:center;max-width:90vw}.countdown{position:absolute;z-index:10;width:250px;height:250px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#fffdf4 0 47%,#f0c66d 48% 56%,#fff9ea 57%);color:#302034;font-size:170px;font-weight:1000;line-height:1;text-shadow:0 4px #e0a84e,0 0 30px #fff;box-shadow:0 0 0 15px #ffffff77,0 0 75px #ffe6b2;animation:countpop .95s ease-out infinite}@keyframes countpop{0%{transform:scale(.56) rotate(-8deg);opacity:.25}55%{transform:scale(1.04) rotate(2deg);opacity:1}100%{transform:scale(1.1);opacity:.68}}.flash{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none;transition:opacity .04s}.flash.on{opacity:1}.review{position:relative;z-index:1;width:min(1160px,100%);text-align:center}.review h2,.gallery h2{font-family:Georgia,serif;font-size:clamp(36px,5vw,61px);color:var(--navy);margin:0 0 8px}.review p{font-size:clamp(17px,2.1vw,22px);margin:0;color:#463343}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:25px 0}.photo-card{position:relative;overflow:hidden;border:4px solid #fff9e8;border-radius:20px;background:#4f3345;box-shadow:0 12px 31px var(--shadow)}.photo-card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.slot{position:absolute;top:10px;left:10px;border-radius:999px;padding:7px 11px;color:#fff;background:#201728c9;font-weight:900;font-size:14px}.retake{position:absolute;bottom:10px;left:10px;right:10px;min-height:54px;background:#fff9e8;color:#3d2638;font-size:16px}.strip-preview{display:block;max-width:min(85vw,375px);max-height:43dvh;margin:17px auto;border-radius:8px;box-shadow:0 16px 45px #1b1020aa}.fine{font-size:15px;color:#654a59}.modal{position:fixed;z-index:50;inset:0;background:#182038e8;display:grid;place-items:center;padding:24px}.modal-inner{width:min(100%,980px);max-height:90dvh;overflow:auto;padding:25px;background:#fff6e9;border-radius:28px;text-align:center;box-shadow:0 22px 55px #0009}.pin{display:block;width:min(100%,380px);min-height:64px;margin:16px auto;border:2px solid #b37b8c;border-radius:16px;font-size:25px;text-align:center}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;text-align:left}.gallery-card{padding:10px;border-radius:14px;background:#f0dde0}.gallery-card img{display:block;width:100%;border-radius:8px}.gallery-card small{display:block;padding:8px 3px;color:#61424f}.thank{background:radial-gradient(circle at 50% 40%,#f4d3cf 0,#b67591 35%,#283049 72%,#182038 100%)}.thank h1{font-size:clamp(50px,10vw,110px)}.confetti{position:absolute;top:-24px;width:12px;height:19px;animation:fall 4s linear infinite}@keyframes fall{to{transform:translateY(110dvh) rotate(720deg)}}@media(max-width:650px){.photos{gap:7px}.photo-card{border-width:2px;border-radius:10px}.retake{left:4px;right:4px;bottom:4px;min-height:46px;padding:7px;font-size:12px}.slot{top:4px;left:4px;font-size:10px}.countdown{width:205px;height:205px;font-size:142px}.controls{margin-top:17px}.screen{padding:20px}}
  </style>
</head>
<body><div id="app"></div><div class="flash" id="flash"></div>
<script>
(() => {
  const WATERMARK='Sarah is 50 and Fabulous ✦',PIN='1976',DB_NAME='sarah50PhotoBooth',STORE='sessions';
  const app=document.getElementById('app'),flash=document.getElementById('flash');let stream=null,photos=[null,null,null],captureIndex=0,inactivity=null,audioCtx=null;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms)),url=b=>URL.createObjectURL(b);
  function db(){return new Promise((ok,bad)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}
  async function saveSession(strip){const d=await db();return new Promise((ok,bad)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).add({createdAt:Date.now(),strip,photos:[...photos]});tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)})}
  async function allSessions(){const d=await db();return new Promise((ok,bad)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result.sort((a,b)=>b.createdAt-a.createdAt));r.onerror=()=>bad(r.error)})}
  async function clearSessions(){const d=await db();return new Promise((ok,bad)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)})}
  function setScreen(name,html){app.dataset.screen=name;app.innerHTML=html;resetTimer()}
  function resetTimer(){clearTimeout(inactivity);if(!['start','thank','admin'].includes(app.dataset.screen))inactivity=setTimeout(startOver,30000)}
  ['pointerdown','touchstart','keydown'].forEach(e=>document.addEventListener(e,resetTimer,{passive:true}));document.addEventListener('touchmove',e=>{if(e.scale!==undefined&&e.scale!==1)e.preventDefault()},{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());
  function tone(freq,duration,type='sine',volume=.12){try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
  function logo(){let hold;const e=document.getElementById('logo');e.onpointerdown=()=>hold=setTimeout(openAdmin,3000);['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,()=>clearTimeout(hold)))}
  function startOver(){stopCamera();photos=[null,null,null];captureIndex=0;startScreen()}
  function startScreen(){clearTimeout(inactivity);setScreen('start',`<main class="screen invitation-bg"><div class="logo" id="logo">Sarah ✦</div><section class="hero"><div class="eyebrow">Disco glam photo booth</div><h1 class="title"><span class="gold">FIFTY & FABULOUS</span></h1><div class="script">An evening to remember</div><p class="tagline">Bring the sparkle, the silly faces, and your most legendary pose. You get <b>three glamour shots</b>—make every one a moment! 🪩✨📸</p><div class="controls"><button class="primary" id="start">✨ Strike a Pose!</button></div><p class="fine">Camera access is requested once when this kiosk first opens.</p></section></main>`);logo();document.getElementById('start').onclick=startCamera}
  async function ensureCamera(){if(stream&&stream.getVideoTracks().some(t=>t.readyState==='live'))return stream;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false});return stream}
  async function startCamera(){try{await ensureCamera();showCamera();setTimeout(takeNext,450)}catch(e){setScreen('error',`<main class="screen invitation-bg"><section class="hero"><h1 class="title">Camera<br><span class="gold">Needed</span></h1><p class="tagline">Please allow camera access in Safari, then come back and work that disco glam. 📸</p><div class="controls"><button class="primary" id="again">Try Camera Again</button></div></section></main>`);document.getElementById('again').onclick=startCamera}}
  function showCamera(){setScreen('camera',`<main class="screen camera-screen"><video id="video" autoplay playsinline muted></video><div class="camera-top"><span class="status" id="status">✨ Get ready — photo ${captureIndex+1} of 3</span></div><div class="camera-bottom"><span class="status" id="prompt">Give us your best sparkle! 🪩</span></div></main>`);document.getElementById('video').srcObject=stream}
  function promptFor(i){return['Show your birthday-best smile! ✨','Switch it up—strike a fierce new pose! 💃','Final shot: go BIG, bold & fabulous! 🪩'][i]}
  async function takeNext(){if(!stream)return;for(let n=5;n>=1;n--){const s=document.getElementById('status'),p=document.getElementById('prompt');if(s)s.textContent=`Photo ${captureIndex+1} of 3 — ${n}`;if(p)p.textContent=promptFor(captureIndex);const e=document.createElement('div');e.className='countdown';e.textContent=n;app.appendChild(e);tone(n===1?930:670,.12,'sine');await sleep(1000);e.remove()}await capture();if(captureIndex<2){captureIndex++;const s=document.getElementById('status');if(s)s.textContent='Yes! One more pose incoming…';await sleep(650);takeNext()}else{reviewScreen()}}
  async function capture(){flash.classList.add('on');tone(125,.24,'sawtooth',.18);await sleep(100);const v=document.getElementById('video'),c=document.createElement('canvas'),w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;const x=c.getContext('2d');x.translate(w,0);x.scale(-1,1);x.drawImage(v,0,0,w,h);x.setTransform(1,0,0,1,0,0);drawWatermark(x,w,h);photos[captureIndex]=await new Promise(r=>c.toBlob(r,'image/jpeg',.94));await sleep(100);flash.classList.remove('on')}
  function drawWatermark(x,w,h){const s=Math.max(26,Math.round(w*.042));x.save();x.font=`italic bold ${s}px Georgia,serif`;x.textAlign='center';x.textBaseline='middle';x.shadowColor='rgba(19,9,23,.9)';x.shadowBlur=Math.max(5,s*.22);x.shadowOffsetY=3;x.fillStyle='#f6d67f';x.fillText(WATERMARK,w/2,h-s*1.2);x.restore()}
  function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
  function reviewScreen(){setScreen('review',`<main class="screen invitation-bg"><section class="review"><div class="logo" id="logo">Sarah ✦</div><h2>Your disco glam gallery ✨</h2><p>Love them all? Your photo strip will save automatically. Want a new vibe? Retake <b>only</b> the photo you tap—your other two stay exactly as they are.</p><div class="photos" id="photos"></div><div class="controls"><button class="secondary" id="another">↻ Take Another Set</button><button class="primary" id="continue">✨ Looking Fabulous!</button></div></section></main>`);logo();renderPhotos();document.getElementById('another').onclick=startOver;document.getElementById('continue').onclick=finish}
  function renderPhotos(){const box=document.getElementById('photos');box.innerHTML=photos.map((b,i)=>`<article class="photo-card"><img src="${url(b)}" alt="Photo ${i+1}"><span class="slot">Glam Shot ${i+1}</span><button class="retake" data-slot="${i}">✨ Retake Only This One</button></article>`).join('');box.querySelectorAll('.retake').forEach(b=>b.onclick=()=>retakeOne(+b.dataset.slot))}
  async function retakeOne(slot){captureIndex=slot;showCamera();await sleep(250);takeNext()}
  async function buildStrip(){const images=await Promise.all(photos.map(b=>new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url(b)})));const W=1200,pad=58,head=195,gap=30,cellH=Math.round((W-pad*2)*.75),H=head+pad+cellH*3+gap*2+pad;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#28304a');grad.addColorStop(.18,'#f2c8c9');grad.addColorStop(1,'#fff5e8');x.fillStyle=grad;x.fillRect(0,0,W,H);x.strokeStyle='#d7a750';x.lineWidth=10;x.strokeRect(18,18,W-36,H-36);x.fillStyle='#f4d27d';x.font='bold 57px Georgia,serif';x.textAlign='center';x.fillText("SARAH'S 50TH",W/2,76);x.font='italic bold 68px Georgia,serif';x.fillText('FIFTY & FABULOUS',W/2,143);images.forEach((im,n)=>{const y=head+pad+n*(cellH+gap);x.drawImage(im,pad,y,W-pad*2,cellH);drawWatermark(x,W,y+cellH)});x.fillStyle='#2e2535';x.font='bold 25px ui-rounded,sans-serif';x.fillText('🪩  DISCO GLAM • SEPTEMBER 12, 2026 • REDONDO BEACH  🪩',W/2,H-35);return new Promise(r=>c.toBlob(r,'image/jpeg',.95))}
  function autoDownload(blob,name){const a=document.createElement('a');a.href=url(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
  async function finish(){const b=document.getElementById('continue');b.disabled=true;b.textContent='✨ Saving your photos…';try{const strip=await buildStrip();await saveSession(strip);const stamp=new Date().toISOString().replace(/[:.]/g,'-');photos.forEach((p,i)=>setTimeout(()=>autoDownload(p,`sarah-50-glam-shot-${i+1}-${stamp}.jpg`),i*650));setTimeout(()=>autoDownload(strip,`sarah-50-fifty-and-fabulous-strip-${stamp}.jpg`),2100);thankScreen()}catch(e){alert('We could not save that strip. Please try again.');b.disabled=false;b.textContent='✨ Looking Fabulous!'}}
  function thankScreen(){clearTimeout(inactivity);setScreen('thank',`<main class="screen thank"><section class="hero"><div class="eyebrow" style="color:#ffe7a5">Your JPEG photos are downloading now</div><h1 class="title" style="color:#fff7e9">You are<br><span class="gold">Fabulous! ✨</span></h1><div class="script" style="color:#fff8ef">Thank you for celebrating Sarah!</div><p class="tagline" style="color:#fff7ed">Your 3 individual photos and photo strip are being saved as JPEG files. Add them to Photos to let Google Photos back them up. 🪩🥂</p><div class="controls"><button class="primary" id="newset">📸 Take Another One</button></div></section></main>`);for(let i=0;i<70;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#f4d27d','#f8a3bd','#fff9e6','#91d6d5','#c99adb'][i%5];e.style.animationDelay=-(Math.random()*4)+'s';e.style.animationDuration=(2.5+Math.random()*2.4)+'s';app.appendChild(e)}document.getElementById('newset').onclick=startOver;setTimeout(startScreen,30000)}
  function openAdmin(){clearTimeout(inactivity);setScreen('admin',`<div class="modal"><section class="modal-inner"><h2>Host Gallery</h2><p>Enter the host PIN to manage locally saved photo strips.</p><input id="pin" class="pin" inputmode="numeric" type="password" maxlength="4" placeholder="PIN"><div class="controls"><button class="secondary" id="cancel">Close</button><button class="primary" id="unlock">Unlock</button></div><p class="fine" id="msg"></p></section></div>`);document.getElementById('cancel').onclick=startScreen;document.getElementById('unlock').onclick=()=>{if(document.getElementById('pin').value===PIN)gallery();else document.getElementById('msg').textContent='Incorrect PIN—try again.'}}
  async function gallery(){const list=await allSessions();setScreen('admin',`<div class="modal"><section class="modal-inner gallery"><h2>Saved Fabulous Strips</h2><p>${list.length} session${list.length===1?'':'s'} stored only on this iPad browser.</p><div class="controls"><button class="secondary" id="close">Close</button><button class="primary" id="all" ${list.length?'':'disabled'}>Download All Strips</button><button class="danger" id="clear" ${list.length?'':'disabled'}>Clear Storage</button></div><div class="gallery-grid" id="grid"></div></section></div>`);const g=document.getElementById('grid');list.forEach(s=>{const c=document.createElement('article');c.className='gallery-card';const i=document.createElement('img');i.src=url(s.strip);const d=document.createElement('small');d.textContent=new Date(s.createdAt).toLocaleString();const b=document.createElement('button');b.className='secondary';b.style.cssText='min-height:52px;width:100%;font-size:14px;padding:8px';b.textContent='Download Strip';b.onclick=()=>autoDownload(s.strip,`sarah50-strip-${s.id}.jpg`);c.append(i,d,b);g.append(c)});document.getElementById('close').onclick=startScreen;document.getElementById('all').onclick=()=>list.forEach((s,n)=>setTimeout(()=>autoDownload(s.strip,`sarah50-strip-${s.id}.jpg`),n*500));document.getElementById('clear').onclick=async()=>{if(confirm('Permanently delete all locally saved strips and photos?')){await clearSessions();gallery()}}}
  window.addEventListener('beforeunload',stopCamera);startScreen();
})();
</script></body></html>
