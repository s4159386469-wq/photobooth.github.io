<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070815" />
  <title>Welcome to Sarah's Fabulous 50th Birthday Party</title>
  <style>
    :root{--night:#070815;--disco:#f7cf62;--cream:#fff9df;--shadow:#02020ccc}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;width:100%;min-height:100%;background:var(--night)}body{overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cream)}button{min-height:68px;padding:15px 27px;border:0;border-radius:999px;font:900 19px ui-rounded,-apple-system,sans-serif;letter-spacing:.02em;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}.screen{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}.disco-bg{isolation:isolate;background:radial-gradient(ellipse at 50% 14%,#693bb1 0,#28175a 25%,#130e35 55%,#070815 100%)}.disco-bg:before{content:"";position:absolute;z-index:-1;inset:-25%;background:repeating-conic-gradient(from 0deg at 50% 0%,transparent 0 8deg,#ef64cf22 8deg 10deg,transparent 10deg 22deg,#53e6f426 22deg 24deg,transparent 24deg 36deg);transform-origin:50% 10%;animation:spin 26s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.disco-bg:after{content:"✦  ✧  ✦  ✧  ✦  ✧  ✦  ✧  ✦";position:absolute;z-index:-1;top:16px;left:50%;transform:translateX(-50%);color:var(--disco);font-size:clamp(30px,4.6vw,61px);letter-spacing:14px;white-space:nowrap;text-shadow:0 0 14px #ffe998,0 0 30px #ff55bd}.hero,.review{position:relative;z-index:1;text-align:center;max-width:1000px}.eyebrow{display:inline-block;margin-bottom:14px;padding:8px 18px;border:1px solid #f7cf6288;border-radius:999px;color:var(--disco);font-size:14px;font-weight:900;letter-spacing:.19em;text-transform:uppercase;background:#08061a80;box-shadow:0 0 18px #f7cf6233}.title{margin:7px 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(47px,8vw,96px);line-height:.9;text-transform:uppercase;text-shadow:0 4px 0 #231039,0 0 18px #ff63c4,0 0 48px #7c58ff}.title .neon{display:block;color:var(--disco);font-size:1.12em;text-shadow:0 3px #9d5b18,0 0 12px #fff2a0,0 0 40px #ff3ca6}.script{margin:16px 0 10px;font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:clamp(31px,5vw,62px);color:#f9a3d1;text-shadow:0 0 17px #ff3ca6}.subtitle{max-width:750px;margin:0 auto;color:#fff6dc;font-size:clamp(18px,2.4vw,25px);line-height:1.42;text-shadow:0 2px 5px #000}.primary{min-width:285px;color:#15051b;background:linear-gradient(115deg,#f7cf62,#fff0a5 35%,#ff71c4 70%,#aa4bff);box-shadow:0 7px 0 #964980,0 0 26px #ff48b1aa}.camera{padding:0;background:#000}.camera video{width:100%;height:100dvh;object-fit:cover;transform:scaleX(-1);background:#111}.camera:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,#ff3ca61e,transparent 25%,transparent 76%,#50e6f424),repeating-linear-gradient(0deg,transparent 0 3px,#ffffff0d 3px 4px);mix-blend-mode:screen}.overlay-top,.overlay-bottom{position:absolute;z-index:5;left:0;right:0;display:flex;justify-content:center;pointer-events:none}.overlay-top{top:max(18px,env(safe-area-inset-top))}.overlay-bottom{bottom:max(28px,env(safe-area-inset-bottom))}.pill{max-width:92vw;padding:11px 21px;border:1px solid #fff8d799;border-radius:999px;background:#0b0922d9;color:#fff8de;text-align:center;font-weight:900;font-size:18px;box-shadow:0 0 18px #ff3ca680,0 0 30px #50e6f455;backdrop-filter:blur(10px)}.countdown{position:absolute;z-index:10;top:50%;left:50%;width:min(58vw,530px);height:min(58vw,530px);min-width:270px;min-height:270px;display:grid;place-items:center;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff9d9 0 43%,#f7cf62 44% 51%,#ff3ca6 52% 57%,#50e6f4 58% 62%,#ffffffd9 63% 65%,#080818 66%);color:#170a24;font-size:clamp(190px,33vw,420px);font-family:Impact,"Arial Black",sans-serif;font-weight:1000;line-height:1;text-shadow:0 6px 0 #e99a34,0 0 25px #fff,0 0 60px #ff3ca6;box-shadow:0 0 0 17px #fff5b955,0 0 36px #f7cf62,0 0 95px #ff3ca6,0 0 150px #50e6f4;animation:countpop .95s ease-out infinite}@keyframes countpop{0%{transform:translate(-50%,-50%) scale(.5) rotate(-10deg);opacity:.2}52%{transform:translate(-50%,-50%) scale(1.04) rotate(2deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:.72}}.flash{position:fixed;z-index:40;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .04s}.flash.on{opacity:1}.review h2{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(37px,6vw,68px);line-height:.95;color:var(--disco);text-shadow:0 3px #92591c,0 0 25px #ff54b5}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:27px 0}.card{position:relative;overflow:hidden;border:4px solid var(--disco);border-radius:18px;background:#361343;box-shadow:0 0 0 3px #ff3ca699,0 14px 34px var(--shadow),0 0 29px #50e6f466}.card img{width:100%;aspect-ratio:3/4;display:block;object-fit:cover}.slot{position:absolute;top:10px;left:10px;padding:7px 11px;border-radius:999px;background:#10061ed9;color:#fff3ba;font-size:13px;font-weight:900;border:1px solid #f7cf62aa}.retake{position:absolute;bottom:10px;left:10px;right:10px;min-height:54px;color:#240b31;background:#fff4bd;font-size:15px;box-shadow:0 0 18px #f7cf62aa}.autosave{margin:13px 0 0;color:#f7d8ef;font-size:16px;font-weight:900;text-shadow:0 1px 3px #000}.progress{display:inline-block;min-width:2ch;color:var(--disco);font-size:1.15em}.disco-ball{position:absolute;z-index:-1;top:6%;right:-4%;width:clamp(120px,22vw,290px);aspect-ratio:1;border-radius:50%;background:repeating-linear-gradient(28deg,#f4e5cc 0 9px,#8f94af 10px 16px,#e9bac6 17px 24px,#5e6080 25px 33px);box-shadow:inset 10px 14px 35px #fff,inset -25px -20px 50px #050517,0 0 48px #fff7ce;opacity:.85;animation:ball 5s ease-in-out infinite}@keyframes ball{50%{transform:translateY(16px) rotate(8deg)}}@media(max-width:650px){.photos{gap:7px}.card{border-width:2px;border-radius:10px}.retake{left:4px;right:4px;bottom:4px;min-height:46px;padding:7px;font-size:12px}.slot{top:4px;left:4px;font-size:10px}.countdown{width:76vw;height:76vw;min-width:0;min-height:0;font-size:clamp(150px,47vw,245px)}.screen{padding:20px}}
  </style>
</head>
<body><div id="app"></div><div class="flash" id="flash"></div>
<script>
(() => {
  const WATERMARK='Sarah is 50 and Fabulous ✦';
  const app=document.getElementById('app'),flash=document.getElementById('flash');let stream=null,photos=[null,null,null],captureIndex=0,audioCtx=null,reviewTimer=null;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms)),objURL=b=>URL.createObjectURL(b);
  function tone(freq,duration,type='sine',volume=.12){try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
  function show(name,html){clearInterval(reviewTimer);app.dataset.screen=name;app.innerHTML=html}
  function welcome(){clearInterval(reviewTimer);photos=[null,null,null];captureIndex=0;show('welcome',`<main class="screen disco-bg"><i class="disco-ball"></i><section class="hero"><div class="eyebrow">🪩 Disco glam photo booth 🪩</div><h1 class="title">Welcome to Sarah's<br><span class="neon">Fabulous 50th<br>Birthday Party</span></h1><div class="script">Get ready to boogie!</div><p class="subtitle">Serve face. Bring the glitter. Give Studio 54 after-dark energy. Three iconic shots, one unforgettable party moment. ✨💃📸</p><div class="controls"><button class="primary" id="start">🪩 Strike a Pose!</button></div><p class="fine">Tap once, then let your inner disco legend shine.</p></section></main>`);document.getElementById('start').onclick=startCamera}
  async function ensureCamera(){if(stream&&stream.getVideoTracks().some(t=>t.readyState==='live'))return;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false})}
  async function startCamera(){try{await ensureCamera();camera();setTimeout(takeSequence,400)}catch(e){show('welcome',`<main class="screen disco-bg"><section class="hero"><h1 class="title">Camera<br><span class="neon">Needed</span></h1><p class="subtitle">Please allow camera access in Safari, then get back on the dance floor. 📸</p><div class="controls"><button class="primary" id="again">Try Again</button></div></section></main>`);document.getElementById('again').onclick=startCamera}}
  function camera(){show('camera',`<main class="screen camera"><video id="video" autoplay playsinline muted></video><div class="overlay-top"><span class="pill" id="status">🪩 Photo ${captureIndex+1} of 3 — get disco-ready!</span></div><div class="overlay-bottom"><span class="pill" id="prompt">Give us superstar energy! ✨</span></div></main>`);document.getElementById('video').srcObject=stream}
  const prompts=['Give us superstar energy! ✨','Change it up—fierce, funny, fabulous! 💃','Last one: BIG Studio 54 finale! 🪩'];
  async function takeSequence(){if(!stream)return;for(let n=5;n>=1;n--){const s=document.getElementById('status'),p=document.getElementById('prompt');if(s)s.textContent=`🪩 Photo ${captureIndex+1} of 3 — ${n}`;if(p)p.textContent=prompts[captureIndex];const c=document.createElement('div');c.className='countdown';c.textContent=n;app.appendChild(c);tone(n===1?980:690,.12,n===1?'square':'sine');await sleep(1000);c.remove()}await capture();if(captureIndex<2){captureIndex++;await sleep(600);takeSequence()}else review()}
  async function capture(){flash.classList.add('on');tone(115,.25,'sawtooth',.2);await sleep(105);const v=document.getElementById('video'),c=document.createElement('canvas'),w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;const x=c.getContext('2d');x.translate(w,0);x.scale(-1,1);x.drawImage(v,0,0,w,h);x.setTransform(1,0,0,1,0,0);stamp(x,w,h);photos[captureIndex]=await new Promise(r=>c.toBlob(r,'image/jpeg',.94));await sleep(100);flash.classList.remove('on')}
  function stamp(x,w,h){const s=Math.max(26,Math.round(w*.042));x.save();x.font=`italic bold ${s}px Georgia,serif`;x.textAlign='center';x.shadowColor='rgba(8,3,18,.95)';x.shadowBlur=Math.max(5,s*.22);x.shadowOffsetY=3;x.fillStyle='#f6d67f';x.fillText(WATERMARK,w/2,h-s*1.2);x.restore()}
  function download(blob,name){const a=document.createElement('a');a.href=objURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2500)}
  function savePhotosAndReturn(){if(app.dataset.screen!=='review'||photos.some(p=>!p))return;const stamp=new Date().toISOString().replace(/[:.]/g,'-');photos.forEach((photo,index)=>setTimeout(()=>download(photo,`sarah-50-glam-shot-${index+1}-${stamp}.jpg`),index*650));setTimeout(welcome,2350)}
  function review(){show('review',`<main class="screen disco-bg"><i class="disco-ball"></i><section class="review"><h2>Disco glam gallery ✨</h2><p class="subtitle">Need a different move? Retake <b>only</b> the photo you tap—your other two shots stay put. Otherwise, your JPEGs will save automatically.</p><div class="photos" id="photos"></div><p class="autosave">✨ Saving your 3 photos in <span class="progress" id="seconds">10</span> seconds…</p></section></main>`);renderPhotos();let remaining=10;reviewTimer=setInterval(()=>{remaining--;const e=document.getElementById('seconds');if(e)e.textContent=remaining;if(remaining<=0){clearInterval(reviewTimer);savePhotosAndReturn()}},1000)}
  function renderPhotos(){const box=document.getElementById('photos');box.innerHTML=photos.map((b,i)=>`<article class="card"><img src="${objURL(b)}" alt="Disco glam shot ${i+1}"><span class="slot">GLAM SHOT ${i+1}</span><button class="retake" data-slot="${i}">✨ Retake Only This One</button></article>`).join('');box.querySelectorAll('.retake').forEach(b=>b.onclick=()=>retake(+b.dataset.slot))}
  async function retake(slot){clearInterval(reviewTimer);captureIndex=slot;camera();await sleep(250);takeSequence()}
  window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('touchmove',e=>{if(e.scale!==undefined&&e.scale!==1)e.preventDefault()},{passive:false});welcome();
})();
</script></body></html>
